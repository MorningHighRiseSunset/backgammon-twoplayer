<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backgammon Masters</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RWGY7JXP6M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RWGY7JXP6M');
    </script>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Backgammon Player vs Player</h1>
            <nav>
                <a href="https://masters-backgammon.netlify.app/" id="computer-vs-player" class="nav-button">Click to Join Computer VS. Player</a>
                <button id="restart" class="nav-button">New Game</button>
            </nav>
        </header>

        <div class="game-info">
            <div id="turn-title" class="turn-indicator">White's Turn</div>
            <button id="roll-dice" class="action-button">Roll Dice</button>
            <button id="end-turn" class="action-button">End Turn</button>
        </div>

        <div id="board">
            <div class="qdr qdr-1"></div>
            <div class="qdr qdr-4"></div>
            <div id="board-bar"></div>
            <div class="qdr qdr-2"></div>
            <div class="qdr qdr-3"></div>

            <div id="dices">
                <div class="dice" id="dice-1"></div>
                <div class="dice" id="dice-2"></div>
            </div>
        </div>
    </div>
</body>
</html>
